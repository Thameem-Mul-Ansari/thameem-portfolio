name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Repository VARIABLES - Settings > Secrets and variables > Actions > Variables
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_GROQ_MODEL: ${{ vars.PUBLIC_GROQ_MODEL }}
      PUBLIC_CONTACT_WEBHOOK_URL: ${{ vars.PUBLIC_CONTACT_WEBHOOK_URL }}
      PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
      # Repository SECRETS - same page, Secrets tab
      PUBLIC_GROQ_API_KEY: ${{ secrets.PUBLIC_GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify build configuration
        run: |
          fail=0
          if [ -z "$PUBLIC_GROQ_API_KEY" ]; then
            echo "::error::Missing repository SECRET PUBLIC_GROQ_API_KEY (Settings > Secrets and variables > Actions > Secrets tab)."
            fail=1
          fi
          if [ -z "$PUBLIC_SITE_URL" ]; then
            echo "::error::Missing repository VARIABLE PUBLIC_SITE_URL (Variables tab). Canonical URLs and the sitemap need it."
            fail=1
          fi
          if [ -z "$PUBLIC_CONTACT_WEBHOOK_URL" ]; then
            echo "::warning::Missing repository VARIABLE PUBLIC_CONTACT_WEBHOOK_URL. The contact form will not submit."
          fi
          exit $fail

      - name: Build site
        run: npm run build

      - name: Deploy to live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANSARI_AUTOMATES_2F488 }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live