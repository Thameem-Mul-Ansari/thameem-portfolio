name: Preview pull request

on:
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  preview:
    # Secrets aren't available to PRs from forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # Repository VARIABLES - Settings > Secrets and variables > Actions > Variables
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_GROQ_MODEL: ${{ vars.PUBLIC_GROQ_MODEL }}
      PUBLIC_CONTACT_WEBHOOK_URL: ${{ vars.PUBLIC_CONTACT_WEBHOOK_URL }}
      PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
      # Repository SECRETS - same page, Secrets tab
      PUBLIC_GROQ_API_KEY: ${{ secrets.PUBLIC_GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify build configuration
        run: |
          if [ -z "$PUBLIC_GROQ_API_KEY" ]; then
            echo "::error::Missing repository SECRET PUBLIC_GROQ_API_KEY (Settings > Secrets and variables > Actions > Secrets tab)."
            exit 1
          fi

      - run: npm run build

      - name: Deploy preview channel
        id: preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANSARI_AUTOMATES_2F488 }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d

      - name: Lighthouse audit of the preview
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          urls: |
            ${{ steps.preview.outputs.details_url }}
          uploadArtifacts: true
          temporaryPublicStorage: true